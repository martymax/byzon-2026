const catalog=[{"id":"participant-invitation","label":"Pozvánka účastníka","subject":"BYZON 2026: váš přístup do konferenční aplikace"},{"id":"team-invitation","label":"Pozvánka do týmu","subject":"BYZON 2026: pozvánka do organizačního týmu"},{"id":"account-activation","label":"Aktivace účtu","subject":"BYZON 2026: dokončete aktivaci účtu"},{"id":"sign-in","label":"Přihlášení","subject":"BYZON 2026: váš přihlašovací odkaz"},{"id":"reservation_confirmed","label":"Potvrzení rezervace","subject":"BYZON 2026: Rezervace potvrzena"},{"id":"reservation_cancelled","label":"Zrušení rezervace","subject":"BYZON 2026: Zrušení rezervace"},{"id":"waitlist_joined","label":"Zařazení do čekací listiny","subject":"BYZON 2026: Zařazení do čekací listiny"},{"id":"waitlist_left","label":"Odhlášení z čekací listiny","subject":"BYZON 2026: Odhlášení z čekací listiny"},{"id":"waitlist_promoted","label":"Uvolněné místo","subject":"BYZON 2026: Místo z čekací listiny je vaše"},{"id":"program_changed","label":"Změna programu","subject":"BYZON 2026: Změna ve vašem programu"},{"id":"announcement","label":"Zpráva organizátorů","subject":"BYZON 2026: Večer se potkáme na nádvoří"},{"id":"rating_reminder","label":"Hodnocení konference","subject":"BYZON 2026: Jaký byl váš BYZON?"}];const frame=document.getElementById('preview');function show(id){const item=catalog.find(e=>e.id===id);document.getElementById('subject').textContent=item.subject;frame.src=id+'.html';document.getElementById('html').href=id+'.html';document.getElementById('text').href=id+'.txt';document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.id===id)));}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.id));document.getElementById('mobile').onclick=()=>frame.style.maxWidth='375px';document.getElementById('desktop').onclick=()=>frame.style.maxWidth='660px';show(catalog[0].id);
